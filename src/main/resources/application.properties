spring.application.name=minimarket
spring.config.import=optional:env.properties

#database properties
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:${DB_DBMS:mysql}://${DB_URL:localhost:3306}/${DB_NAME:minimarket}?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.${DB_DIALECT:MySQLDialect}

#output format
logging.pattern.dateformat=hh:mm
spring.devtools.restart.enabled=true
spring.jpa.properties.format.sql=true
spring.jpa.show-sql=true